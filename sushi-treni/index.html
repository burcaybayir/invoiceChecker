<title>Suşi Treni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
  :root {
    color-scheme: light;
    --wood: #C98C52;
    --wood-lt: #D9A26A;
    --wood-dk: #7A4520;
    --wood-deep: #4E2A12;
    --lacquer: #B3342A;
    --lacquer-dk: #7E1F18;
    --paper: #FBF1DE;
    --ink: #2E1C10;
    --matcha: #5E8F2E;
    --gold: #F2B233;
    --gold-dk: #B7791A;
    --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    font-family: var(--body);
    color: var(--ink);
    background-color: var(--wood);
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 2px, transparent 2px 64px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 23px, rgba(0,0,0,.03) 23px 41px, transparent 41px 64px);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    position: relative;
    box-sizing: border-box;
    height: 100%;
    max-width: 540px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* HUD */
  #hud { display: flex; align-items: center; gap: 10px; }
  .pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--wood-deep);
    color: var(--paper);
    border-radius: 999px;
    padding: 6px 12px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
  }
  .lvl small { font: 800 10px/1 var(--body); letter-spacing: .12em; opacity: .75; }
  .lvl b { font: 22px/1 var(--display); }
  .goal { flex: 1; display: grid; gap: 4px; padding-block: 6px; }
  .goal-top { display: flex; justify-content: space-between; align-items: baseline; font: 800 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
  .goal-top b { font: 18px/1 var(--display); letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .meter { height: 10px; border-radius: 99px; background: rgba(0,0,0,.35); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; border-radius: inherit; transition: width .25s ease, background-color .25s; }
  #servedFill { background: var(--matcha); }
  .coins b { font: 20px/1 var(--display); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
  .coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFE08A, var(--gold) 55%, var(--gold-dk)); box-shadow: inset 0 0 0 2px rgba(0,0,0,.12); }

  /* Belt */
  #stage { position: relative; align-self: center; }
  #belt { display: block; }

  /* Capacity */
  #capbar { display: flex; align-items: center; gap: 10px; background: var(--wood-deep); color: var(--paper); border-radius: 12px; padding: 6px 12px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
  #capbar .lab { font: 800 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; }
  #capbar .meter { flex: 1; height: 12px; }
  #capbar b { font: 18px/1 var(--display); font-variant-numeric: tabular-nums; }
  #capFill { background: var(--matcha); }

  /* Columns */
  #cols { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .col {
    appearance: none; border: 0; margin: 0; cursor: pointer;
    font: inherit; color: inherit;
    min-width: 0; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 0 6px;
    border-radius: 12px 12px 6px 6px;
    background: linear-gradient(180deg, var(--wood-dk), #5F3417);
    box-shadow: inset 0 3px 8px rgba(0,0,0,.45), inset 0 -2px 0 rgba(255,255,255,.08);
    transition: transform .08s;
  }
  .col:active { transform: scale(.97); }
  .col:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .col.shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }
  .dish {
    position: relative; flex: none;
    width: var(--cell); height: var(--cell);
    display: grid; place-items: center;
    font-size: calc(var(--cell) * .6); line-height: 1;
    border-radius: 50%;
    background: radial-gradient(circle, var(--c) 0 56%, #fff 57% 66%, var(--c) 67%);
    box-shadow: 0 2px 0 rgba(0,0,0,.35);
    filter: saturate(.8) brightness(.88);
  }
  .dish.top { filter: none; box-shadow: 0 0 0 3px var(--gold), 0 3px 0 rgba(0,0,0,.35); animation: bob 1.4s ease-in-out infinite; animation-delay: calc(var(--i) * -.12s); }
  @keyframes bob { 50% { transform: translateY(-2px); } }
  .more { font: 16px/1 var(--display); color: var(--paper); opacity: .85; padding-top: 2px; }
  .empty { margin: auto; font: 800 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--paper); opacity: .45; }

  /* Tools */
  #tools { display: flex; gap: 8px; }
  #tools button {
    flex: 1; appearance: none; border: 0; cursor: pointer;
    font: 16px/1 var(--display); letter-spacing: .02em;
    color: var(--paper); background: var(--lacquer);
    border-radius: 12px; padding: 11px 8px 13px;
    box-shadow: inset 0 -4px 0 var(--lacquer-dk);
  }
  #tools button:disabled { opacity: .45; cursor: default; }
  #tools button[aria-pressed="true"] { background: var(--matcha); box-shadow: inset 0 -4px 0 #3F6719; }
  #tools button:focus-visible, .ov button:focus-visible, .chip:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #tools .n { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-left: 4px; border-radius: 99px; background: rgba(0,0,0,.25); font-size: 13px; }

  /* Toast */
  #toast {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.9);
    background: var(--ink); color: var(--paper);
    font: 800 15px/1.2 var(--body); padding: 10px 16px; border-radius: 12px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap;
  }
  #toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* Overlay */
  #overlay { position: absolute; inset: 0; display: grid; place-items: center; padding-inline: 16px; background: rgba(46,28,16,.55); z-index: 5; }
  #overlay[hidden] { display: none; }
  .ov {
    width: min(100%, 380px); box-sizing: border-box;
    background: var(--paper); border-radius: 20px; padding: 22px 20px 20px;
    box-shadow: 0 10px 0 var(--wood-deep), 0 20px 40px rgba(0,0,0,.35);
    display: grid; gap: 14px; text-align: center;
    border-top: 10px solid var(--lacquer);
  }
  .ov h1 { margin: 0; font: 40px/1 var(--display); color: var(--lacquer); text-wrap: balance; letter-spacing: .01em; }
  .ov h2 { margin: 0; font: 30px/1.05 var(--display); color: var(--lacquer); text-wrap: balance; }
  .ov p { margin: 0; font: 700 15px/1.45 var(--body); }
  .ov .sub { font: 800 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--wood-dk); }
  .rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; text-align: left; }
  .rules li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font: 700 14px/1.4 var(--body); }
  .rules li span { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--lacquer); color: var(--paper); font: 15px/1 var(--display); }
  .stars { font-size: 44px; line-height: 1; letter-spacing: 4px; color: #E4D3B4; }
  .stars .on { color: var(--gold); text-shadow: 0 3px 0 var(--gold-dk); }
  .stats { display: flex; justify-content: center; gap: 18px; font: 800 13px/1.3 var(--body); }
  .stats b { display: block; font: 24px/1 var(--display); color: var(--ink); }
  .btns { display: grid; gap: 8px; }
  .ov button {
    appearance: none; border: 0; cursor: pointer;
    font: 20px/1 var(--display); padding: 13px 14px 15px; border-radius: 14px;
    color: var(--paper); background: var(--matcha); box-shadow: inset 0 -5px 0 #3F6719;
  }
  .ov button.alt { background: var(--wood-dk); box-shadow: inset 0 -5px 0 var(--wood-deep); font-size: 17px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .chip {
    appearance: none; cursor: pointer; width: 40px; height: 40px; border-radius: 10px;
    border: 2px solid var(--wood-dk); background: transparent; color: var(--wood-dk);
    font: 18px/1 var(--display);
  }
  .chip[aria-current="true"] { background: var(--wood-dk); color: var(--paper); }

  @media (prefers-reduced-motion: reduce) {
    .dish.top { animation: none; }
    .col.shake { animation: none; }
  }
</style>

<div id="app">
  <header id="hud">
    <div class="pill lvl"><small>SEVİYE</small><b id="lvl">1</b></div>
    <div class="pill goal">
      <div class="goal-top"><span>Servis</span><b id="served">0/0</b></div>
      <div class="meter"><i id="servedFill"></i></div>
    </div>
    <div class="pill coins"><span class="coin" aria-hidden="true"></span><b id="coins">0</b></div>
  </header>

  <div id="stage"><canvas id="belt" aria-label="Döner suşi bandı ve müşteriler"></canvas></div>

  <div id="capbar">
    <span class="lab">Bant</span>
    <div class="meter"><i id="capFill"></i></div>
    <b id="cap">0/0</b>
  </div>

  <div id="cols">
    <button class="col" id="col0" type="button"></button>
    <button class="col" id="col1" type="button"></button>
    <button class="col" id="col2" type="button"></button>
    <button class="col" id="col3" type="button"></button>
    <button class="col" id="col4" type="button"></button>
  </div>

  <nav id="tools">
    <button id="undoBtn" type="button">Geri al<span class="n" id="undoN">3</span></button>
    <button id="fastBtn" type="button" aria-pressed="false">Hız ×2</button>
    <button id="menuBtn" type="button">Menü</button>
  </nav>

  <div id="toast" role="status"></div>
  <div id="overlay"></div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

  // Plate colour marks the dish, like kaiten-zushi plates mark the price.
  const TYPES = [
    { e: '🍣', n: 'Somon',    c: '#F6A376' },
    { e: '🍤', n: 'Karides',  c: '#FFD8A6' },
    { e: '🐙', n: 'Ahtapot',  c: '#F3B3C4' },
    { e: '🍙', n: 'Onigiri',  c: '#E3ECF3' },
    { e: '🥚', n: 'Tamago',   c: '#FBE27F' },
    { e: '🥒', n: 'Kappa',    c: '#B6DE98' },
    { e: '🦀', n: 'Yengeç',   c: '#F2917F' },
    { e: '🍥', n: 'Naruto',   c: '#D7CEF6' },
    { e: '🦑', n: 'Kalamar',  c: '#A6D3F4' },
  ];
  const FACES = ['👩🏻','🧔🏽','👩🏼‍🦱','👨🏾','👵🏻','🧑🏻‍🦰','👴🏽','👧🏾','🧕🏽','👨🏻‍🦳','🧑🏿','👩🏽‍🦳','👱🏼‍♀️','🧑🏽‍🦱'];
  const BASE_SPEED = 2.4; // slots per second
  const SEAT_POS = [ [0.095, 0.085], [0.905, 0.085], [0.905, 0.915], [0.095, 0.915] ]; // TL TR BR BL
  const BUBBLE_POS = [ [0.30, 0.075], [0.70, 0.075], [0.70, 0.925], [0.30, 0.925] ];
  const SEAT_ARC = [7, 1, 3, 5]; // path segment of each seat's corner

  const cv = $('#belt'), ctx = cv.getContext('2d');
  let W = 300, H = 315, dpr = 1, geo = null, sprites = [], rows = 6;
  let st = null, running = false, fast = false, soundOn = true, actx = null;
  let save = { level: 1, coins: 0 };
  let uid = 0;

  try { const s = JSON.parse(localStorage.getItem('susi-treni') || 'null'); if (s) save = Object.assign(save, s); } catch (e) {}
  const persist = () => { try { localStorage.setItem('susi-treni', JSON.stringify(save)); } catch (e) {} };

  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* ---------- Level generation ---------- */
  function makeLevel(n) {
    const nTypes = Math.min(3 + n, 9);
    const cap = Math.max(30, 46 - 2 * n);
    const total = 40 + 10 * n;
    const types = shuffle([...TYPES.keys()]).slice(0, nTypes);
    const counts = {};
    types.forEach((t, i) => counts[t] = Math.floor(total / nTypes) + (i < total % nTypes ? 1 : 0));
    const all = [];
    types.forEach(t => { for (let i = 0; i < counts[t]; i++) all.push(t); });
    shuffle(all);

    const pre = Math.floor(cap * 0.35);
    const slots = new Array(cap).fill(null);
    all.slice(0, pre).forEach((t, i) => slots[Math.floor(i * cap / pre)] = { id: ++uid, t });

    const rest = {};
    all.slice(pre).forEach(t => rest[t] = (rest[t] || 0) + 1);
    let keys = Object.keys(rest).map(Number);
    const runs = [];
    while (keys.length) {
      const t = pick(keys);
      const len = Math.min(rest[t], rnd(1, n < 3 ? 4 : 3));
      runs.push({ t, len });
      rest[t] -= len;
      if (!rest[t]) keys = keys.filter(k => k !== t);
    }
    shuffle(runs);
    const cols = [[], [], [], [], []];
    runs.forEach(r => {
      const min = Math.min(...cols.map(c => c.length));
      const c = pick(cols.filter(c => c.length <= min + 2));
      for (let i = 0; i < r.len; i++) c.push({ id: ++uid, t: r.t });
    });
    return { n, cap, total, types, cols, slots, remaining: { ...counts } };
  }

  function newGame(n) {
    st = Object.assign(makeLevel(n), {
      offset: 0, queue: [], served: 0, coins: 0, peak: 0, time: 0,
      seats: [0, 1, 2, 3].map(i => ({ state: 'empty', timer: 0.3 + i * 0.45, anim: 0, bump: 0, face: '', type: null, need: 0 })),
      flying: [], floats: [], lastSend: null, undo: 3, over: false, stuck: 0, lastIdx: {},
    });
    layout();
    renderCols();
    updateHud();
  }

  const count = () => st.slots.reduce((a, x) => a + (x ? 1 : 0), 0) + st.queue.length;

  function pickOrder() {
    const free = {};
    for (const t of st.types) {
      let f = st.remaining[t];
      st.seats.forEach(s => { if (s.type === t && s.need > 0) f -= s.need; });
      if (f > 0) free[t] = f;
    }
    let cand = Object.keys(free).map(Number);
    if (!cand.length) return null;
    const active = new Set(st.seats.filter(s => s.need > 0).map(s => s.type));
    const fresh = cand.filter(t => !active.has(t));
    if (fresh.length) cand = fresh;
    const onBelt = new Set(st.slots.filter(Boolean).map(x => x.t));
    const beltCand = cand.filter(t => onBelt.has(t));
    const fill = count() / st.cap;
    if (beltCand.length && (fill >= 0.9 || Math.random() < 0.3 + fill * 0.5)) cand = beltCand;
    const t = pick(cand);
    let need = Math.min(free[t], rnd(2, Math.min(3 + st.n, 8)));
    if (free[t] - need <= 2) need = free[t];
    return { t, need };
  }

  /* ---------- Player actions ---------- */
  function tapCol(ci) {
    if (!st || !running || st.over) return;
    const col = st.cols[ci];
    if (!col.length) return;
    const t = col[0].t;
    let g = 0;
    while (g < col.length && col[g].t === t) g++;
    const room = st.cap - count();
    if (room <= 0) {
      const el = $('#col' + ci);
      el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      toast('Bantta yer yok!');
      sfx('err');
      return;
    }
    const items = col.splice(0, Math.min(g, room));
    st.queue.push(...items);
    st.lastSend = { ci, ids: items.map(x => x.id) };
    if (items.length < g) toast(`Sadece ${items.length} tabak sığdı`);
    sfx('pop');
    renderCols();
    updateHud();
  }

  function undo() {
    if (!st || !running || st.over) return;
    if (st.undo <= 0) return;
    if (!st.lastSend) { toast('Geri alınacak hamle yok'); return; }
    const ids = new Set(st.lastSend.ids), back = [];
    st.queue = st.queue.filter(x => ids.has(x.id) ? (back.push(x), false) : true);
    st.slots.forEach((x, i) => { if (x && ids.has(x.id)) { back.push(x); st.slots[i] = null; } });
    const ci = st.lastSend.ci;
    st.lastSend = null;
    if (!back.length) { toast('O tabaklar çoktan servis edildi'); return; }
    st.cols[ci].unshift(...back);
    st.undo--;
    sfx('pop');
    renderCols();
    updateHud();
  }

  /* ---------- Simulation ---------- */
  function arrive(key, frac, fn) {
    const C = st.cap;
    const i = ((Math.round(frac * C - st.offset) % C) + C) % C;
    if (st.lastIdx[key] !== i) { st.lastIdx[key] = i; fn(i); }
  }

  function take(s, k, i, it) {
    st.slots[i] = null;
    s.need--;
    st.remaining[it.t]--;
    st.served++;
    st.coins++;
    st.flying.push({ t: it.t, from: beltPos(i), k, time: 0 });
    if (s.need === 0) {
      s.state = 'happy'; s.anim = 0;
      st.coins += 5;
      const b = bubbleXY(k);
      st.floats.push({ x: b.x, y: b.y, txt: '+5', time: 0, big: true });
      sfx('done');
    } else sfx('take');
    updateHud();
  }

  function update(dt) {
    if (!st) return;
    st.seats.forEach(s => { s.anim += dt; s.bump = Math.max(0, s.bump - dt); });
    st.flying = st.flying.filter(f => {
      f.time += dt;
      if (f.time >= 0.38) {
        st.seats[f.k].bump = 0.18;
        const p = seatXY(f.k);
        st.floats.push({ x: p.x, y: p.y - W * 0.05, txt: '+1', time: 0 });
        return false;
      }
      return true;
    });
    st.floats = st.floats.filter(f => (f.time += dt) < 0.9);
    if (!running || st.over) return;

    st.time += dt;
    const sp = BASE_SPEED * (fast ? 2 : 1) * (1 + (st.n - 1) * 0.04);
    st.offset = (st.offset + sp * dt) % st.cap;

    arrive('entry', geo.entryFrac, i => {
      if (!st.slots[i] && st.queue.length) st.slots[i] = st.queue.shift();
    });

    st.seats.forEach((s, k) => {
      arrive('c' + k, geo.seatFrac[k], i => {
        const it = st.slots[i];
        if (it && s.state === 'waiting' && s.need > 0 && it.t === s.type) take(s, k, i, it);
      });
      if (s.state === 'empty') {
        s.timer -= dt;
        if (s.timer <= 0) {
          const o = pickOrder();
          if (o) Object.assign(s, { state: 'arriving', anim: 0, type: o.t, need: o.need, face: pick(FACES) });
          else s.timer = 0.5;
        }
      } else if (s.state === 'arriving' && s.anim > 0.45) s.state = 'waiting';
      else if (s.state === 'happy' && s.anim > 1.0) { s.state = 'leaving'; s.anim = 0; }
      else if (s.state === 'leaving' && s.anim > 0.35) { s.state = 'empty'; s.timer = 0.4; s.type = null; }
    });

    const c = count();
    st.peak = Math.max(st.peak, c / st.cap);
    updateCap(c);

    if (st.served >= st.total && !st.flying.length) {
      st.over = true;
      setTimeout(showWin, 500);
      return;
    }
    // Stuck: belt full and every seated customer wants something that is not on it.
    const full = st.slots.every(Boolean);
    const onBelt = new Set(st.slots.filter(Boolean).map(x => x.t));
    const blocked = full && st.seats.every(s => s.state === 'waiting' && !onBelt.has(s.type));
    st.stuck = blocked ? st.stuck + dt : 0;
    if (st.stuck > 1.2) {
      st.over = true;
      setTimeout(showLose, 400);
    }
  }

  /* ---------- Geometry ---------- */
  function buildGeo() {
    const x0 = W * 0.13, x1 = W * 0.87, y0 = H * 0.17, y1 = H * 0.83, r = W * 0.11;
    const segs = [];
    const L = (ax, ay, bx, by) => segs.push({ k: 'L', ax, ay, bx, by, len: Math.hypot(bx - ax, by - ay) });
    const A = (cx, cy, a0) => segs.push({ k: 'A', cx, cy, a0, len: r * Math.PI / 2 });
    L(x0 + r, y0, x1 - r, y0); A(x1 - r, y0 + r, -Math.PI / 2);
    L(x1, y0 + r, x1, y1 - r); A(x1 - r, y1 - r, 0);
    L(x1 - r, y1, x0 + r, y1); A(x0 + r, y1 - r, Math.PI / 2);
    L(x0, y1 - r, x0, y0 + r); A(x0 + r, y0 + r, Math.PI);
    let acc = 0;
    segs.forEach(s => { s.start = acc; acc += s.len; });
    const P = acc;
    const cap = st ? st.cap : 44;
    const sp = P / cap;
    const bw = Math.min(sp * 1.3, W * 0.085);
    const seatFrac = SEAT_ARC.map(i => (segs[i].start + segs[i].len / 2) / P);
    const entryFrac = (segs[4].start + segs[4].len / 2) / P;
    geo = { x0, x1, y0, y1, r, segs, P, sp, bw, pad: bw / 2 + W * 0.022, pr: Math.min(sp * 0.47, W * 0.04), seatFrac, entryFrac };
  }

  function pointAt(s) {
    s = ((s % geo.P) + geo.P) % geo.P;
    for (const g of geo.segs) {
      if (s <= g.start + g.len) {
        const t = (s - g.start) / g.len;
        if (g.k === 'L') return { x: g.ax + (g.bx - g.ax) * t, y: g.ay + (g.by - g.ay) * t };
        const a = g.a0 + t * Math.PI / 2;
        return { x: g.cx + geo.r * Math.cos(a), y: g.cy + geo.r * Math.sin(a) };
      }
    }
    return { x: 0, y: 0 };
  }
  const beltPos = i => pointAt(((i + st.offset) / st.cap) * geo.P);
  const seatXY = k => ({ x: SEAT_POS[k][0] * W, y: SEAT_POS[k][1] * H });
  const bubbleXY = k => ({ x: BUBBLE_POS[k][0] * W, y: BUBBLE_POS[k][1] * H });

  function tracePath() {
    const { x0, x1, y0, y1, r } = geo;
    ctx.beginPath();
    ctx.moveTo(x0 + r, y0);
    ctx.lineTo(x1 - r, y0); ctx.arc(x1 - r, y0 + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x1, y1 - r); ctx.arc(x1 - r, y1 - r, r, 0, Math.PI / 2);
    ctx.lineTo(x0 + r, y1); ctx.arc(x0 + r, y1 - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x0, y0 + r); ctx.arc(x0 + r, y0 + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function buildSprites() {
    const pr = geo.pr, size = Math.ceil((pr * 2 + 4) * dpr);
    sprites = TYPES.map(T => {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const m = size / 2, R = pr * dpr;
      g.fillStyle = 'rgba(0,0,0,.28)';
      g.beginPath(); g.arc(m, m + R * 0.12, R, 0, Math.PI * 2); g.fill();
      g.fillStyle = T.c;
      g.beginPath(); g.arc(m, m, R, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = R * 0.14;
      g.beginPath(); g.arc(m, m, R * 0.72, 0, Math.PI * 2); g.stroke();
      g.font = `${R * 1.25}px ${EMOJI}`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(T.e, m, m + R * 0.08);
      return c;
    });
  }
  const spriteSize = () => geo.pr * 2 + 4;
  function drawSprite(t, x, y, scale = 1) {
    const s = spriteSize() * scale;
    ctx.drawImage(sprites[t], x - s / 2, y - s / 2, s, s);
  }

  /* ---------- Rendering ---------- */
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (!st || !geo) return;
    const g = geo;

    // lacquered counter
    ctx.save();
    ctx.shadowColor = 'rgba(60,25,5,.45)'; ctx.shadowBlur = W * 0.03; ctx.shadowOffsetY = W * 0.014;
    rr(g.x0 - g.pad, g.y0 - g.pad, g.x1 - g.x0 + g.pad * 2, g.y1 - g.y0 + g.pad * 2, g.r + g.pad);
    ctx.fillStyle = '#B3342A'; ctx.fill();
    ctx.restore();
    rr(g.x0 - g.pad, g.y0 - g.pad, g.x1 - g.x0 + g.pad * 2, g.y1 - g.y0 + g.pad * 2, g.r + g.pad);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.stroke();

    // kitchen well
    const kx = g.x0 + g.pad, ky = g.y0 + g.pad, kw = g.x1 - g.x0 - g.pad * 2, kh = g.y1 - g.y0 - g.pad * 2;
    ctx.save();
    rr(kx, ky, kw, kh, Math.max(6, g.r - g.pad));
    ctx.clip();
    ctx.fillStyle = '#56647A'; ctx.fillRect(kx, ky, kw, kh);
    ctx.fillStyle = '#3B4658'; ctx.fillRect(kx, ky + kh * 0.55, kw, kh * 0.45);
    // noren curtain
    const nh = kh * 0.2, panels = 4, pw = kw / panels;
    for (let i = 0; i < panels; i++) {
      ctx.fillStyle = i % 2 ? '#1F3A5F' : '#244570';
      ctx.fillRect(kx + i * pw + 1, ky, pw - 2, nh);
    }
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(kx + kw / 2, ky + nh * 0.5, nh * 0.26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#B3342A';
    ctx.beginPath(); ctx.arc(kx + kw / 2, ky + nh * 0.5, nh * 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // chef
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${W * 0.19}px ${EMOJI}`;
    const bob = Math.sin(st.time * 3) * W * 0.004;
    ctx.fillText('👨🏾‍🍳', W / 2, H * 0.47 + bob);
    // glass case
    const gw = kw * 0.62, gh = W * 0.085, gx = W / 2 - gw / 2, gy = H * 0.585;
    rr(gx, gy, gw, gh, 8);
    ctx.fillStyle = 'rgba(214,236,250,.55)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.stroke();
    ctx.font = `${gh * 0.52}px ${EMOJI}`;
    ['🐟', '🦐', '🐙', '🥬', '🦀'].forEach((e, i, a) => ctx.fillText(e, gx + gw * (i + 0.5) / a.length, gy + gh * 0.55));

    // belt
    tracePath();
    ctx.lineWidth = g.bw; ctx.strokeStyle = '#8E969F'; ctx.stroke();
    ctx.lineWidth = g.bw - 4; ctx.strokeStyle = '#D3D9DF'; ctx.stroke();
    ctx.save();
    ctx.setLineDash([Math.max(1.2, g.sp * 0.07), g.sp - Math.max(1.2, g.sp * 0.07)]);
    ctx.lineDashOffset = -(0.5 + st.offset) * g.sp;
    ctx.lineWidth = g.bw - 6; ctx.strokeStyle = 'rgba(60,70,80,.22)'; ctx.stroke();
    ctx.restore();

    // entry hatch
    const hx = W / 2, hy = g.y1 + g.bw / 2;
    rr(hx - g.sp * 0.9, hy - 2, g.sp * 1.8, W * 0.035, 5);
    ctx.fillStyle = '#2E1C10'; ctx.fill();

    // plates on the belt
    for (let i = 0; i < st.cap; i++) {
      const it = st.slots[i];
      if (!it) continue;
      const p = beltPos(i);
      drawSprite(it.t, p.x, p.y);
    }
    if (st.queue.length) {
      const bx = hx, by = hy + W * 0.05;
      rr(bx - W * 0.045, by - W * 0.022, W * 0.09, W * 0.044, W * 0.022);
      ctx.fillStyle = '#F2B233'; ctx.fill();
      ctx.fillStyle = '#2E1C10';
      ctx.font = `${W * 0.034}px "Lilita One", sans-serif`;
      ctx.fillText('+' + st.queue.length, bx, by + 1);
    }

    // customers
    st.seats.forEach((s, k) => drawSeat(s, k));

    // flying plates
    st.flying.forEach(f => {
      const t = Math.min(1, f.time / 0.38), e = 1 - Math.pow(1 - t, 3);
      const to = seatXY(f.k);
      const x = f.from.x + (to.x - f.from.x) * e;
      const y = f.from.y + (to.y - f.from.y) * e - Math.sin(Math.PI * t) * W * 0.06;
      drawSprite(f.t, x, y, 1 - 0.45 * t);
    });

    // floating text
    st.floats.forEach(f => {
      const t = f.time / 0.9;
      ctx.globalAlpha = 1 - t;
      ctx.font = `${W * (f.big ? 0.06 : 0.042)}px "Lilita One", sans-serif`;
      ctx.lineWidth = 4; ctx.strokeStyle = '#4E2A12'; ctx.fillStyle = '#F2B233';
      const y = f.y - t * W * 0.07;
      ctx.strokeText(f.txt, f.x, y); ctx.fillText(f.txt, f.x, y);
      ctx.globalAlpha = 1;
    });
  }

  function drawSeat(s, k) {
    const p = seatXY(k), R = W * 0.07;
    // cushion
    ctx.fillStyle = 'rgba(78,42,18,.28)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + R * 0.75, R * 0.95, R * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    if (s.state === 'empty') return;
    let sc = 1;
    if (s.state === 'arriving') sc = easeBack(Math.min(1, s.anim / 0.45));
    if (s.state === 'leaving') sc = Math.max(0, 1 - s.anim / 0.35);
    sc *= 1 + s.bump * 0.8;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.scale(sc, sc);
    ctx.fillStyle = '#FBF1DE';
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = s.state === 'happy' ? '#5E8F2E' : '#7A4520'; ctx.stroke();
    ctx.font = `${R * 1.35}px ${EMOJI}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(s.face, 0, R * 0.08);
    ctx.restore();
    if (s.state === 'happy') {
      ctx.font = `${W * 0.04}px ${EMOJI}`;
      ctx.fillText('💕', p.x + R * 0.7, p.y - R * 0.8 - s.anim * W * 0.03);
    }
    if (s.state === 'leaving') return;

    // order bubble
    const b = bubbleXY(k), bw = W * 0.2, bh = W * 0.1;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(sc, sc);
    ctx.fillStyle = '#FBF1DE';
    ctx.strokeStyle = '#7A4520'; ctx.lineWidth = 2.5;
    const dir = p.x < b.x ? -1 : 1;
    rr(-bw / 2, -bh / 2, bw, bh, bh / 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(dir * bw * 0.34, -bh * 0.2);
    ctx.lineTo(dir * bw * 0.62, 0);
    ctx.lineTo(dir * bw * 0.34, bh * 0.22);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(dir * bw * 0.4, -bh * 0.22); ctx.lineTo(dir * bw * 0.62, 0); ctx.lineTo(dir * bw * 0.4, bh * 0.24);
    ctx.stroke();
    drawSprite(s.type, -bw * 0.2, 0, Math.min(1.25, (bh * 0.82) / spriteSize()));
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (s.state === 'happy') {
      ctx.fillStyle = '#5E8F2E';
      ctx.font = `${bh * 0.62}px "Lilita One", sans-serif`;
      ctx.fillText('✓', bw * 0.22, bh * 0.03);
    } else {
      ctx.fillStyle = '#2E1C10';
      ctx.font = `${bh * 0.52}px "Lilita One", sans-serif`;
      ctx.fillText('×' + s.need, bw * 0.2, bh * 0.05);
    }
    ctx.restore();
  }
  const easeBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  /* ---------- DOM ---------- */
  function renderCols() {
    st.cols.forEach((col, ci) => {
      const el = $('#col' + ci);
      if (!col.length) {
        el.innerHTML = '<span class="empty">Boş</span>';
        el.setAttribute('aria-label', `Sütun ${ci + 1}: boş`);
        return;
      }
      const t = col[0].t;
      let g = 0;
      while (g < col.length && col[g].t === t) g++;
      const more = col.length > rows;
      const shown = more ? rows - 1 : col.length;
      let html = '';
      for (let i = 0; i < shown; i++) {
        const T = TYPES[col[i].t];
        html += `<span class="dish${i < g ? ' top' : ''}" style="--c:${T.c};--i:${i}" aria-hidden="true">${T.e}</span>`;
      }
      if (more) html += `<span class="more" aria-hidden="true">+${col.length - shown}</span>`;
      el.innerHTML = html;
      el.setAttribute('aria-label', `Sütun ${ci + 1}: üstte ${g} ${TYPES[t].n}, toplam ${col.length} tabak`);
    });
  }

  function updateCap(c) {
    $('#cap').textContent = `${c}/${st.cap}`;
    const f = c / st.cap, el = $('#capFill');
    el.style.width = (f * 100) + '%';
    el.style.backgroundColor = f < 0.7 ? '#5E8F2E' : f < 0.9 ? '#E09A1F' : '#D2402F';
  }
  function updateHud() {
    $('#lvl').textContent = st.n;
    $('#served').textContent = `${st.served}/${st.total}`;
    $('#servedFill').style.width = (st.served / st.total * 100) + '%';
    $('#coins').textContent = save.coins + st.coins;
    $('#undoN').textContent = st.undo;
    $('#undoBtn').disabled = st.undo <= 0;
    updateCap(count());
  }

  let toastT = 0;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(() => el.classList.remove('on'), 1300);
  }

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const app = $('#app');
    const cs = getComputedStyle(app);
    const aw = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const fixed = $('#hud').offsetHeight + $('#capbar').offsetHeight + $('#tools').offsetHeight + 8 * 4;
    const colsMin = Math.max(180, ah * 0.3);
    let w = Math.min(aw, (ah - fixed - colsMin) / 1.05);
    w = Math.max(220, Math.floor(w));
    W = w; H = Math.round(w * 1.05);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    buildGeo();
    buildSprites();
    const cols = $('#cols');
    const colW = (cols.clientWidth - 6 * 4) / 5;
    const cell = Math.max(24, Math.min(colW * 0.8, 56, (cols.clientHeight - 14) / 6.5 - 3));
    cols.style.setProperty('--cell', cell + 'px');
    rows = Math.max(3, Math.floor((cols.clientHeight - 14) / (cell + 3)));
    if (st) renderCols();
  }

  /* ---------- Overlays ---------- */
  function overlay(html, actions) {
    const ov = $('#overlay');
    ov.innerHTML = `<div class="ov" role="dialog" aria-modal="true">${html}</div>`;
    ov.hidden = false;
    ov.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => actions[b.dataset.a](b)));
    const first = ov.querySelector('button'); if (first) first.focus();
  }
  function closeOverlay() { $('#overlay').hidden = true; }

  function chips(current) {
    const max = Math.max(1, save.level), from = Math.max(1, max - 11);
    let h = '';
    for (let i = from; i <= max; i++) h += `<button class="chip" type="button" data-a="lvl" data-l="${i}" aria-current="${i === current}">${i}</button>`;
    return `<div class="chips" aria-label="Seviye seç">${h}</div>`;
  }

  function showStart() {
    running = false;
    const lv = save.level;
    overlay(`
      <div class="sub">Döner suşi barı</div>
      <h1>Suşi Treni</h1>
      <ul class="rules">
        <li><span>1</span>Bir sütuna dokun: en üstteki aynı tabaklar banda çıkar.</li>
        <li><span>2</span>Müşteriler balonlarındaki suşiyi, önlerinden geçerken bantan alır.</li>
        <li><span>3</span>Bant dolar ve kimse bir şey alamazsa oyun biter. Hepsini servis et!</li>
      </ul>
      ${chips(lv)}
      <div class="btns"><button type="button" data-a="go">Seviye ${lv} · Başla</button></div>
    `, {
      go: () => start(lv),
      lvl: b => start(+b.dataset.l),
    });
  }

  function showMenu() {
    if (!st || st.over) return;
    running = false;
    overlay(`
      <div class="sub">Mola</div>
      <h2>Seviye ${st.n}</h2>
      <p>${st.served}/${st.total} tabak servis edildi.</p>
      ${chips(st.n)}
      <div class="btns">
        <button type="button" data-a="go">Devam et</button>
        <button type="button" class="alt" data-a="re">Seviyeyi yeniden başlat</button>
        <button type="button" class="alt" data-a="snd">Ses: ${soundOn ? 'Açık' : 'Kapalı'}</button>
      </div>
    `, {
      go: () => { closeOverlay(); running = true; },
      re: () => start(st.n),
      lvl: b => start(+b.dataset.l),
      snd: b => { soundOn = !soundOn; b.textContent = `Ses: ${soundOn ? 'Açık' : 'Kapalı'}`; },
    });
  }

  function showWin() {
    running = false;
    const stars = st.peak < 0.75 ? 3 : st.peak < 0.92 ? 2 : 1;
    save.coins += st.coins;
    save.level = Math.max(save.level, st.n + 1);
    persist();
    sfx('win');
    const s = [1, 2, 3].map(i => `<span class="${i <= stars ? 'on' : ''}">★</span>`).join('');
    overlay(`
      <div class="sub">Seviye ${st.n} tamam</div>
      <h2>Afiyet olsun!</h2>
      <div class="stars" aria-label="${stars} yıldız">${s}</div>
      <div class="stats">
        <div><b>%${Math.round(st.peak * 100)}</b>en yüksek doluluk</div>
        <div><b>+${st.coins}</b>altın</div>
        <div><b>${Math.round(st.time)} sn</b>süre</div>
      </div>
      <p>Bandı %75'in altında tutarsan üç yıldız alırsın.</p>
      <div class="btns">
        <button type="button" data-a="next">Seviye ${st.n + 1}</button>
        <button type="button" class="alt" data-a="re">Tekrar oyna</button>
      </div>
    `, { next: () => start(st.n + 1), re: () => start(st.n) });
    updateHud();
  }

  function showLose() {
    running = false;
    sfx('lose');
    overlay(`
      <div class="sub">Seviye ${st.n}</div>
      <h2>Bant tıkandı!</h2>
      <p>Bant, oturan müşterilerin hiçbirinin istemediği tabaklarla doldu. Siparişi olan tabakları sırayla gönder, gerisini sütunda beklet.</p>
      <div class="stats"><div><b>${st.served}/${st.total}</b>servis</div></div>
      <div class="btns"><button type="button" data-a="re">Tekrar dene</button></div>
    `, { re: () => start(st.n) });
  }

  function start(n) {
    initAudio();
    closeOverlay();
    newGame(n);
    running = true;
  }

  /* ---------- Sound ---------- */
  function initAudio() {
    if (actx) return;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  function tone(f, d, type = 'sine', vol = 0.12, delay = 0) {
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0 + d + 0.02);
  }
  function sfx(k) {
    if (!soundOn || !actx) return;
    try {
      if (k === 'pop') tone(520, 0.09, 'triangle');
      else if (k === 'take') tone(880, 0.07, 'sine', 0.08);
      else if (k === 'done') [660, 880, 1100].forEach((f, i) => tone(f, 0.12, 'triangle', 0.1, i * 0.07));
      else if (k === 'err') tone(150, 0.18, 'square', 0.06);
      else if (k === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.12, i * 0.1));
      else if (k === 'lose') [392, 330, 262].forEach((f, i) => tone(f, 0.25, 'sawtooth', 0.05, i * 0.14));
    } catch (e) {}
  }

  /* ---------- Wiring ---------- */
  for (let i = 0; i < 5; i++) $('#col' + i).addEventListener('click', () => tapCol(i));
  $('#undoBtn').addEventListener('click', undo);
  $('#fastBtn').addEventListener('click', () => {
    fast = !fast;
    $('#fastBtn').setAttribute('aria-pressed', fast);
  });
  $('#menuBtn').addEventListener('click', showMenu);
  window.addEventListener('keydown', e => {
    if (!$('#overlay').hidden) return;
    if (e.key >= '1' && e.key <= '5') tapCol(+e.key - 1);
    else if (e.key === 'z' || e.key === 'Z') undo();
    else if (e.key === 'Escape') showMenu();
  });
  window.addEventListener('resize', layout);
  document.addEventListener('visibilitychange', () => { if (document.hidden && running) showMenu(); });

  let last = 0;
  function frame(t) {
    const dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function boot(data) {
    if (data && data.level) save.level = Math.max(save.level, data.level);
    try { window.claude?.hot?.snapshot?.(() => ({ level: save.level })); } catch (e) {}
    newGame(save.level);
    showStart();
    requestAnimationFrame(frame);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());
  }
  const hot = window.claude?.hot;
  hot?.ready ? hot.ready(boot) : boot(hot?.data ?? {});
})();
</script>
